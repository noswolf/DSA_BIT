<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01526102: DSA - Big-O Interactive Guide</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6;
            margin-top: -8px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons ---
        const Icon = ({ path, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            TrendingUp: (props) => <Icon path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></>} {...props} />,
            Play: (props) => <Icon path={<polygon points="5 3 19 12 5 21 5 3" />} {...props} />,
            RotateCcw: (props) => <Icon path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12" /><path d="M3 3v9h9" /></>} {...props} />,
            Search: (props) => <Icon path={<><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></>} {...props} />,
            ChevronRight: (props) => <Icon path={<polyline points="9 18 15 12 9 6" />} {...props} />,
            Info: (props) => <Icon path={<><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></>} {...props} />,
            Server: (props) => <Icon path={<><rect x="2" y="2" width="20" height="8" rx="2" ry="2" /><rect x="2" y="14" width="20" height="8" rx="2" ry="2" /><line x1="6" y1="6" x2="6.01" y2="6" /><line x1="6" y1="18" x2="6.01" y2="18" /></>} {...props} />,
            BarChart3: (props) => <Icon path={<><line x1="18" y1="20" x2="18" y2="10" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="6" y1="20" x2="6" y2="14" /></>} {...props} />,
            Clock: (props) => <Icon path={<><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>} {...props} />,
            Database: (props) => <Icon path={<><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /></>} {...props} />,
            Layers: (props) => <Icon path={<><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></>} {...props} />,
        };

        // --- Constants & Logic ---
        const COLORS = {
            primary: '#0f172a',
            accent: '#3b82f6',
            danger: '#ef4444',
            success: '#10b981',
            warning: '#f59e0b',
            purple: '#8b5cf6',
        };

        // Calculates steps based on N, Complexity, and the specific Case (Best/Avg/Worst)
        const calculateSteps = (n, type, simCase) => {
            switch (type) {
                case 'O(1)': 
                    // Constant is always constant
                    return 1;
                
                case 'O(log n)': 
                    // Binary Search
                    if (simCase === 'best') return 1; // Found at middle immediately
                    if (simCase === 'average') return Math.ceil(Math.log2(n)) - 1; // Approx
                    return Math.ceil(Math.log2(n)); // Worst case path
                
                case 'O(n)': 
                    // Linear Search
                    if (simCase === 'best') return 1; // Found at index 0
                    if (simCase === 'average') return Math.floor(n / 2); // Found in middle
                    return n; // Found at end or not found
                
                case 'O(n log n)': 
                    // Merge Sort (Consistent) / Quick Sort (Variable)
                    // We'll simulate Quick Sort behavior for variety
                    if (simCase === 'best') return Math.ceil(n * Math.log2(n)); 
                    if (simCase === 'average') return Math.ceil(n * Math.log2(n) * 1.1); 
                    // Worst case Quick Sort is technically O(n^2), but let's stick to Merge Sort stability for this generic label
                    // to avoid confusing students about the label itself.
                    return Math.ceil(n * Math.log2(n));

                case 'O(n^2)': 
                    // Bubble Sort (Optimized with swap flag)
                    if (simCase === 'best') return n; // Already sorted, just one pass
                    if (simCase === 'average') return Math.floor((n * n) / 2);
                    return n * n; // Reverse sorted
                
                default: return 0;
            }
        };

        const getExampleContext = (type, simCase) => {
            const base = {};
            switch (type) {
                case 'O(1)': 
                    base.title = "O(1) - Index Access";
                    base.scenario = "Accessing list[0]";
                    base.desc = "Best, Average, and Worst are identical. Accessing an array index is instant.";
                    break;
                case 'O(log n)': 
                    base.title = "O(log n) - Binary Search";
                    base.scenario = simCase === 'best' ? "Target is exactly in the middle." : "Target is at the edges or missing.";
                    base.desc = "We cut the search space in half each step.";
                    break;
                case 'O(n)': 
                    base.title = "O(n) - Linear Search";
                    base.scenario = simCase === 'best' ? "Target is the first item." : (simCase === 'worst' ? "Target is the last item." : "Target is in the middle.");
                    base.desc = "We check items one by one.";
                    break;
                case 'O(n log n)': 
                    base.title = "O(n log n) - Merge Sort";
                    base.scenario = "Sorting a list";
                    base.desc = "Divide and conquer. The structure ensures consistent performance regardless of data order (for Merge Sort).";
                    break;
                case 'O(n^2)': 
                    base.title = "O(n²) - Bubble Sort";
                    base.scenario = simCase === 'best' ? "List is already sorted." : "List is reverse sorted.";
                    base.desc = "Comparing every item with every other item.";
                    break;
            }
            return base;
        };

        // --- Components ---

        const Header = () => (
            <header className="bg-slate-900 text-white p-6 shadow-md border-b border-slate-700">
                <div className="max-w-6xl mx-auto flex justify-between items-center">
                    <div>
                        <h1 className="text-2xl font-bold flex items-center gap-2">
                            <Icons.TrendingUp className="text-blue-400" size={24} />
                            01526102: DSA - Big-O Interactive Guide
                        </h1>
                        <p className="text-slate-400 text-sm mt-1">Topic: Algorithm Analysis (Big-O)</p>
                    </div>
                    <div className="text-right text-xs text-slate-500">
                        Generated by Gemini, Google. (2025, December 15)<br />
                        Edited by Dr. Sirasit Lochanachit, IT KMITL
                    </div>
                </div>
            </header>
        );

        const CaseSelector = ({ selected, onChange }) => (
            <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 mb-6">
                {['best', 'average', 'worst'].map((c) => (
                    <button
                        key={c}
                        onClick={() => onChange(c)}
                        className={`flex-1 py-2 px-3 text-sm font-semibold rounded-md transition-all capitalize ${
                            selected === c 
                            ? 'bg-white text-blue-600 shadow-sm border border-slate-100' 
                            : 'text-slate-500 hover:text-slate-700'
                        }`}
                    >
                        {c} Case
                    </button>
                ))}
            </div>
        );

        const GraphCanvas = ({ activeType, inputN, simCase }) => {
            const width = 300;
            const height = 200;
            const padding = 20;
            const maxN = 100;
            const maxSteps = 200; // Y-axis scale

            // Generate the generic "Big-O Curve" (usually represents Worst Case / Upper Bound)
            const generatePath = (type, color, isActive) => {
                let d = `M ${padding} ${height - padding}`;
                for (let x = 1; x <= maxN; x += 2) {
                    let yVal = calculateSteps(x, type, 'worst'); // Plot the worst case curve as the reference
                    if (type === 'O(n^2)') yVal = yVal / 5;
                    if (type === 'O(n log n)') yVal = yVal / 2;
                    
                    const plotX = padding + (x / maxN) * (width - 2 * padding);
                    const plotY = (height - padding) - (Math.min(yVal, maxSteps) / maxSteps) * (height - 2 * padding);
                    d += ` L ${plotX} ${plotY}`;
                }
                
                return (
                    <path
                        key={type}
                        d={d}
                        fill="none"
                        stroke={color}
                        strokeWidth={isActive ? 3 : 1}
                        strokeOpacity={isActive ? 1 : 0.15}
                        strokeDasharray={isActive ? "0" : "4 2"}
                    />
                );
            };

            // Calculate current specific point based on CASE (Best/Avg/Worst)
            const currentSteps = calculateSteps(inputN, activeType, simCase);
            
            // Scaled Y for plotting
            let plotYRaw = currentSteps;
            if (activeType === 'O(n^2)') plotYRaw = plotYRaw / 5;
            if (activeType === 'O(n log n)') plotYRaw = plotYRaw / 2;
            
            const indicatorX = padding + (inputN / maxN) * (width - 2 * padding);
            const indicatorY = (height - padding) - (Math.min(plotYRaw, maxSteps) / maxSteps) * (height - 2 * padding);

            return (
                <div className="relative bg-slate-800 rounded-lg p-4 shadow-inner border border-slate-700 h-full">
                    <div className="absolute top-2 left-4 text-xs text-slate-400 font-mono">Operations</div>
                    <div className="absolute bottom-2 right-4 text-xs text-slate-400 font-mono">Input Size (N)</div>
                    <svg width="100%" height="100%" viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
                        <line x1={padding} y1={padding} x2={padding} y2={height - padding} stroke="#475569" strokeWidth="1" />
                        <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} stroke="#475569" strokeWidth="1" />
                        
                        {/* Reference Curves (Worst Case) */}
                        {generatePath('O(1)', COLORS.success, activeType === 'O(1)')}
                        {generatePath('O(log n)', COLORS.accent, activeType === 'O(log n)')}
                        {generatePath('O(n)', COLORS.warning, activeType === 'O(n)')}
                        {generatePath('O(n log n)', COLORS.purple, activeType === 'O(n log n)')}
                        {generatePath('O(n^2)', COLORS.danger, activeType === 'O(n^2)')}

                        {/* Drop line to X axis */}
                        <line x1={indicatorX} y1={indicatorY} x2={indicatorX} y2={height - padding} stroke="white" strokeWidth="1" strokeDasharray="2 2" opacity="0.5" />
                        
                        {/* Drop line to Y axis */}
                        <line x1={padding} y1={indicatorY} x2={indicatorX} y2={indicatorY} stroke="white" strokeWidth="1" strokeDasharray="2 2" opacity="0.5" />

                        {/* Current Point */}
                        <circle cx={indicatorX} cy={indicatorY} r="6" fill={simCase === 'best' ? COLORS.success : simCase === 'worst' ? COLORS.danger : COLORS.warning} stroke="white" strokeWidth="2" />
                        
                        {/* Labels */}
                        <text x={indicatorX + 8} y={indicatorY - 5} fill="white" fontSize="10" fontWeight="bold">
                            Steps: {currentSteps}
                        </text>
                    </svg>
                </div>
            );
        };

        // --- Main Component ---

        const App = () => {
            const [n, setN] = useState(20);
            const [activeComplexity, setActiveComplexity] = useState('O(n)');
            const [simCase, setSimCase] = useState('average'); // best, average, worst
            const [isRunning, setIsRunning] = useState(false);
            const [simProgress, setSimProgress] = useState(0);
            
            const context = getExampleContext(activeComplexity, simCase);
            const totalSteps = calculateSteps(n, activeComplexity, simCase);

            useEffect(() => {
                if (isRunning) {
                    setSimProgress(0);
                    // Time depends on total steps slightly to give "feel" of speed, but clamped
                    const animationDuration = Math.min(2000, Math.max(500, totalSteps * 10)); 
                    const interval = 20;
                    const frames = animationDuration / interval;
                    let currentFrame = 0;

                    const timer = setInterval(() => {
                        currentFrame++;
                        setSimProgress((currentFrame / frames) * 100);
                        if (currentFrame >= frames) {
                            clearInterval(timer);
                            setIsRunning(false);
                        }
                    }, interval);

                    return () => clearInterval(timer);
                }
            }, [isRunning, totalSteps]);

            const handleComplexityChange = (type) => {
                setActiveComplexity(type);
                setSimProgress(0);
                setIsRunning(false);
            };

            const handleCaseChange = (c) => {
                setSimCase(c);
                setSimProgress(0);
                setIsRunning(false);
            };

            // Grid Visualizer Logic
            const renderGrid = () => {
                const items = [];
                // Determine highlight logic based on Algo and Case
                let targetIndex = -1;
                
                if (activeComplexity === 'O(1)') targetIndex = 0;
                else if (activeComplexity === 'O(n)') {
                    if (simCase === 'best') targetIndex = 0;
                    else if (simCase === 'average') targetIndex = Math.floor(n / 2);
                    else targetIndex = n - 1;
                } else if (activeComplexity === 'O(log n)') {
                    // Visual abstraction for binary search
                    if (simCase === 'best') targetIndex = Math.floor(n/2);
                    else targetIndex = -1; // Complicated to visualize single index for log n path
                }

                for (let i = 0; i < n; i++) {
                    let state = 'default'; // default, checked, found, active
                    
                    if (isRunning || simProgress === 100) {
                        const progressRatio = simProgress / 100;
                        const stepsDone = Math.floor(totalSteps * progressRatio);

                        if (activeComplexity === 'O(n)') {
                             // Linear Search Logic
                             if (i < stepsDone) state = 'checked';
                             if (i === stepsDone && i === targetIndex) state = 'found';
                             else if (i === stepsDone) state = 'active';
                        } 
                        else if (activeComplexity === 'O(1)') {
                            if (i === 0 && stepsDone >= 1) state = 'found';
                        }
                        else if (activeComplexity === 'O(n^2)') {
                            // Bubble Sort Logic (Abstract)
                            // Highlight "bubbling"
                            const currentPass = Math.floor(stepsDone / n);
                            if (i > (n - currentPass)) state = 'found'; // Sorted part at end
                            else if (Math.random() < 0.3 && i < n - currentPass) state = 'active'; // Random activity
                        }
                        else if (activeComplexity === 'O(log n)') {
                             // Binary Search Logic
                             // Light up sectors
                             if (stepsDone > 0) {
                                 // Simple visual: narrow down
                                 const range = n / Math.pow(2, stepsDone);
                                 if (i > (n/2 - range) && i < (n/2 + range)) state = 'active';
                                 else state = 'checked';
                             }
                        }
                    }

                    let colorClass = 'bg-slate-200';
                    if (state === 'checked') colorClass = 'bg-slate-400';
                    if (state === 'active') colorClass = 'bg-blue-400 scale-110 shadow-lg';
                    if (state === 'found') colorClass = 'bg-green-500 scale-110 shadow-lg';

                    items.push(
                        <div key={i} className={`w-3 h-3 rounded-sm transition-all duration-300 ${colorClass}`} />
                    );
                }
                return items;
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800">
                    <Header />

                    <main className="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        {/* LEFT COLUMN: Controls */}
                        <div className="lg:col-span-4 space-y-6">
                        
                            {/* Algorithm Selector */}
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="bg-slate-100 p-3 border-b border-slate-200 font-semibold text-slate-700 flex items-center gap-2">
                                    <Icons.Layers size={18} /> 1. Select Algorithm
                                </div>
                                <div className="p-2 space-y-1">
                                    {['O(1)', 'O(log n)', 'O(n)', 'O(n log n)', 'O(n^2)'].map((type) => (
                                        <button
                                            key={type}
                                            onClick={() => handleComplexityChange(type)}
                                            className={`w-full text-left px-4 py-3 rounded-lg flex justify-between items-center transition-all ${
                                                activeComplexity === type 
                                                ? 'bg-blue-50 text-blue-700 border border-blue-200 shadow-sm' 
                                                : 'hover:bg-slate-50 text-slate-600'
                                            }`}
                                        >
                                            <span className="font-mono font-bold">{type}</span>
                                            {activeComplexity === type && <Icons.ChevronRight size={16} />}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Case Selector & Input */}
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-3">
                                    2. Simulation Conditions
                                </label>
                                
                                <CaseSelector selected={simCase} onChange={handleCaseChange} />

                                <label className="block text-sm font-semibold text-slate-700 mb-2 mt-6">
                                    Input Size (N): {n} items
                                </label>
                                <input
                                    type="range"
                                    min="5"
                                    max="100"
                                    step="5"
                                    value={n}
                                    onChange={(e) => setN(parseInt(e.target.value))}
                                    className="w-full mb-4"
                                />
                                
                                <button 
                                    onClick={() => setIsRunning(true)}
                                    disabled={isRunning}
                                    className={`w-full py-3 rounded-lg flex items-center justify-center gap-2 font-bold text-white transition-all shadow-md ${
                                        isRunning ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 hover:shadow-lg active:scale-95'
                                    }`}
                                >
                                    {isRunning ? 'Simulating...' : <><Icons.Play size={18} /> Run Simulation</>}
                                </button>
                            </div>

                            {/* Educational Note */}
                            <div className={`p-4 rounded-lg border-l-4 text-sm leading-relaxed ${
                                simCase === 'best' ? 'bg-green-50 border-green-500 text-green-900' :
                                simCase === 'worst' ? 'bg-red-50 border-red-500 text-red-900' :
                                'bg-amber-50 border-amber-500 text-amber-900'
                            }`}>
                                <strong className="block mb-1 flex items-center gap-2">
                                    <Icons.Info size={16} /> 
                                    {simCase === 'best' ? 'Best Case Scenario' : simCase === 'worst' ? 'Worst Case Scenario' : 'Average Case Scenario'}
                                </strong>
                                {simCase === 'best' && "The 'Lucky' guess. The item is right where we look first, or the data is perfectly ordered."}
                                {simCase === 'average' && "The Real World. Usually we search half the list, or sort partially disordered data."}
                                {simCase === 'worst' && "The Bottleneck. This is what Big-O notation usually measures (Upper Bound). We must plan for this to prevent crashes."}
                            </div>
                        </div>

                        {/* RIGHT COLUMN: Visualization */}
                        <div className="lg:col-span-8 space-y-6">
                        
                            {/* Dashboard */}
                            <div className="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden min-h-[500px] flex flex-col">
                                <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                                    <h2 className="font-bold text-slate-800 flex items-center gap-2">
                                        <Icons.Server size={20} className="text-slate-500" />
                                        Performance Lab
                                    </h2>
                                    <div className="flex gap-2">
                                        <span className="bg-white border border-slate-200 text-slate-600 px-3 py-1 rounded-md text-xs font-mono font-bold shadow-sm">
                                            {activeComplexity}
                                        </span>
                                        <span className={`px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider text-white shadow-sm ${
                                            simCase === 'best' ? 'bg-green-500' : simCase === 'worst' ? 'bg-red-500' : 'bg-amber-500'
                                        }`}>
                                            {simCase}
                                        </span>
                                    </div>
                                </div>
                                
                                <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-8 flex-grow">
                                    
                                    {/* Graph Section */}
                                    <div className="flex flex-col">
                                        <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                                            <Icons.BarChart3 size={14} /> Complexity Curve
                                        </h4>
                                        <div className="flex-grow min-h-[200px]">
                                            <GraphCanvas activeType={activeComplexity} inputN={n} simCase={simCase} />
                                        </div>
                                    </div>

                                    {/* Metrics Section */}
                                    <div className="flex flex-col space-y-4 justify-center">
                                        <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                            <div className="text-xs text-slate-500 mb-1 font-bold uppercase">Scenario</div>
                                            <div className="text-base font-medium text-slate-900">{context.scenario}</div>
                                            <div className="text-xs text-slate-500 mt-2">{context.desc}</div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className={`p-4 rounded-lg border ${
                                                simCase === 'worst' ? 'bg-red-50 border-red-100' : 'bg-blue-50 border-blue-100'
                                            }`}>
                                                <div className="text-xs opacity-70 mb-1 flex items-center gap-1 font-bold uppercase">
                                                    <Icons.Clock size={12} /> Steps Taken
                                                </div>
                                                <div className="text-3xl font-bold font-mono">
                                                    {isRunning ? Math.floor(totalSteps * (simProgress / 100)) : totalSteps}
                                                </div>
                                            </div>
                                            
                                            <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 flex flex-col justify-center">
                                                <div className="text-xs text-slate-500 mb-1 font-bold uppercase">Efficiency</div>
                                                <div className="text-sm font-medium">
                                                    {simCase === 'best' ? 'Maximum' : simCase === 'worst' ? 'Minimum' : 'Variable'}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Progress Bar */}
                                        <div>
                                            <div className="flex justify-between text-xs text-slate-500 mb-1 font-mono">
                                                <span>Execution</span>
                                                <span>{Math.round(simProgress)}%</span>
                                            </div>
                                            <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                                                <div 
                                                    className={`h-full transition-all duration-75 ${
                                                        simCase === 'worst' ? 'bg-red-500' : simCase === 'best' ? 'bg-green-500' : 'bg-amber-500'
                                                    }`}
                                                    style={{ width: `${simProgress}%` }}
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                {/* Visualizer Grid */}
                                <div className="bg-slate-50 p-6 border-t border-slate-200">
                                    <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">
                                        Data Visualization (N={n})
                                    </h4>
                                    <div className="flex flex-wrap gap-1 content-start h-24 overflow-hidden">
                                        {renderGrid()}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
