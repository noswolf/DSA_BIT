<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const Icon = ({ name, size = 20, color = "currentColor", className="" }) => {
            if (name === 'tree') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20v-8m0 0l4-4m-4 4l-4-4m4 12l5-5m-5 5l-5-5"></path><circle cx="12" cy="5" r="3"></circle></svg>;
            if (name === 'play') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
            if (name === 'book') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>;
            if (name === 'alert') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
            if (name === 'refresh') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;
            if (name === 'layers') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>;
            if (name === 'list') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>;
            if (name === 'chart') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>;
            if (name === 'globe') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>;
            return null;
        };

        // --- Data Structures ---
        const STANDARD_TREE = {
            id: 'A', value: 'A',
            left: {
                id: 'B', value: 'B',
                left: { id: 'D', value: 'D', left: null, right: null },
                right: { id: 'E', value: 'E', left: null, right: null }
            },
            right: {
                id: 'C', value: 'C',
                left: { id: 'F', value: 'F', left: null, right: null },
                right: { id: 'G', value: 'G', left: null, right: null }
            }
        };

        const UNBALANCED_TREE_FIRST = {
            id: 'A', value: 'A',
            left: {
                id: 'B', value: 'B',
                left: {
                    id: 'D', value: 'D',
                    left: { id: 'E', value: 'E', left: null, right: null },
                    right: { id: 'F', value: 'F', left: null, right: null }
                },
                right: null
            },
            right: {
                id: 'C', value: 'C',
                left: {
                    id: 'H', value: 'H',
                    left: null,
                    right: { id: 'I', value: 'I', left: null, right: null }
                },
                right: { id: 'G', value: 'G', left: null, right: null }
            }
        };

        const UNBALANCED_TREE_SECOND = {
            id: 'A', value: 'A',
            left: {
                id: 'B', value: 'B',
                left: {
                    id: 'D', value: 'D',
                    left: { id: 'H', value: 'H', left: null, right: null },
                    right: { id: 'I', value: 'I', left: null, right: null }
                },
                right: { id: 'E', value: 'E', left: null, right: null },
            },
            right: {
                id: 'C', value: 'C',
                left: { id: 'F', value: 'F', left: null, right: null },
                right: {
                    id: 'G', value: 'G',
                    left: { id: 'J', value: 'J', left: null, right: null },
                    right: null
                },

            }
        };

        // --- Visualization Components ---
        const TreeNodeVisual = ({ node, x, y, level, highlightedNode, visitedNodes }) => {
            if (!node) return null;
            const spread = 24 / Math.pow(2, Math.min(level, 3));
            const isHighlighted = highlightedNode === node.id;
            const isVisited = visitedNodes.includes(node.id);
            let bgColor = 'bg-white', borderColor = 'border-slate-300', textColor = 'text-slate-700', scaleClass = '', shadowClass = 'shadow-sm';

            if (isHighlighted) {
                bgColor = 'bg-yellow-300'; borderColor = 'border-yellow-500'; scaleClass = 'scale-125 z-20'; shadowClass = 'shadow-xl ring-4 ring-yellow-100'; textColor = 'text-yellow-900';
            } else if (isVisited) {
                bgColor = 'bg-blue-600'; borderColor = 'border-blue-800'; textColor = 'text-white'; shadowClass = 'shadow-md';
            }

            return (
                <div className="absolute top-0 left-0 w-full h-full pointer-events-none">
                    <div className={`absolute w-10 h-10 -ml-5 rounded-full border-2 flex items-center justify-center font-bold text-sm transition-all duration-300 node-enter ${bgColor} ${borderColor} ${textColor} ${scaleClass} ${shadowClass}`} style={{ left: `${x}%`, top: `${y}%`, zIndex: 10 }}>{node.value}</div>
                    <TreeNodeVisual node={node.left} x={x - spread} y={y + 15} level={level + 1} highlightedNode={highlightedNode} visitedNodes={visitedNodes} />
                    <TreeNodeVisual node={node.right} x={x + spread} y={y + 15} level={level + 1} highlightedNode={highlightedNode} visitedNodes={visitedNodes} />
                </div>
            );
        };

        const TreeEdges = ({ node, x, y, level }) => {
            if (!node) return null;
            const spread = 24 / Math.pow(2, Math.min(level, 3));
            const childY = y + 15;
            return (
                <>
                    {node.left && <><line x1={`${x}%`} y1={`${y + 2}%`} x2={`${x - spread}%`} y2={`${childY}%`} stroke="#94a3b8" strokeWidth="2" /><TreeEdges node={node.left} x={x - spread} y={childY} level={level + 1} /></>}
                    {node.right && <><line x1={`${x}%`} y1={`${y + 2}%`} x2={`${x + spread}%`} y2={`${childY}%`} stroke="#94a3b8" strokeWidth="2" /><TreeEdges node={node.right} x={x + spread} y={childY} level={level + 1} /></>}
                </>
            );
        };



        // --- Main App ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('structure');
            const [logs, setLogs] = useState(["System Ready."]);
            const [highlightedNode, setHighlightedNode] = useState(null);
            const [visitedNodes, setVisitedNodes] = useState([]);
            const [sequence, setSequence] = useState([]);
            const [isRunning, setIsRunning] = useState(false);
            const [speed, setSpeed] = useState(1);
            const logEndRef = useRef(null);
            const [callStack, setCallStack] = useState([]);

            useEffect(() => { logEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [logs]);
            const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms / speed));
            const log = (msg) => setLogs(prev => [...prev, msg]);

            const getCurrentTree = () => {
                if (activeTab === 'skewed') return UNBALANCED_TREE_FIRST;
                if (activeTab === 'unbalanced') return UNBALANCED_TREE_SECOND;
                return STANDARD_TREE;
            };

            useEffect(() => {
                setHighlightedNode(null); setVisitedNodes([]); setSequence([]); setIsRunning(false); setLogs([]);
                log(`Switched to ${activeTab} view.`);
            }, [activeTab]);

            const resetSimulation = () => {
                setHighlightedNode(null); setVisitedNodes([]); setSequence([]); setIsRunning(false); log("Simulation reset.");
            };

            // Traversal Functions
            const bfs = async () => {
                if (isRunning) return; setIsRunning(true); setVisitedNodes([]); setSequence([]);
                const tree = getCurrentTree();
                const queue = [tree];
                while (queue.length > 0) {
                    const node = queue.shift();
                    setHighlightedNode(node.id); log(`Visiting Node: ${node.value}`); await wait(1000);
                    setVisitedNodes(prev => [...prev, node.id]); setSequence(prev => [...prev, node.value]);
                    if (node.left) queue.push(node.left);
                    if (node.right) queue.push(node.right);
                    await wait(500);
                }
                setHighlightedNode(null); setIsRunning(false);
            };

            const dfsPreOrder = async () => {
                if (isRunning) return; setIsRunning(true); setVisitedNodes([]); setSequence([]);
                const tree = getCurrentTree();
                const traverse = async (node) => {
                    if (!node) return;
                    setHighlightedNode(node.id); log(`Visit Root: ${node.value}`); await wait(1000);
                    setVisitedNodes(prev => [...prev, node.id]); setSequence(prev => [...prev, node.value]);
                    if (node.left) await traverse(node.left);
                    if (node.right) await traverse(node.right);
                };
                await traverse(tree); setHighlightedNode(null); setIsRunning(false);
            };

            const dfsInOrder = async () => {
                if (isRunning) return; setIsRunning(true); setVisitedNodes([]); setSequence([]);
                const tree = getCurrentTree();
                const traverse = async (node) => {
                    if (!node) return;
                    if (node.left) await traverse(node.left);
                    setHighlightedNode(node.id); log(`Visit Root: ${node.value}`); await wait(1000);
                    setVisitedNodes(prev => [...prev, node.id]); setSequence(prev => [...prev, node.value]);
                    if (node.right) await traverse(node.right);
                };
                await traverse(tree); setHighlightedNode(null); setIsRunning(false);
            };

            const dfsPostOrder = async () => {
                if (isRunning) return; setIsRunning(true); setVisitedNodes([]); setSequence([]);
                const tree = getCurrentTree();
                const traverse = async (node) => {
                    if (!node) return;
                    if (node.left) await traverse(node.left);
                    if (node.right) await traverse(node.right);
                    setHighlightedNode(node.id); log(`Visit Root: ${node.value}`); await wait(1000);
                    setVisitedNodes(prev => [...prev, node.id]); setSequence(prev => [...prev, node.value]);
                };
                await traverse(tree); setHighlightedNode(null); setIsRunning(false);
            };

            const dfsPreOrderRecursive = async () => {
    if (isRunning) return;
    setIsRunning(true);
    setVisitedNodes([]);
    setSequence([]);
    setLogs([]);
    setCallStack([]);

    const tree = getCurrentTree();

    const traverse = async (node) => {
        if (!node) return;

        // CALL
        setCallStack(prev => [...prev, node.value]);
        log(`CALL traverse(${node.value})`);
        setHighlightedNode(node.id);
        await wait(800);

        // VISIT
        setVisitedNodes(prev => [...prev, node.id]);
        setSequence(prev => [...prev, node.value]);
        log(`VISIT ${node.value}`);
        await wait(800);

        // RECUR
        if (node.left) await traverse(node.left);
        if (node.right) await traverse(node.right);

        // RETURN
        log(`RETURN traverse(${node.value})`);
        setCallStack(prev => prev.slice(0, -1));
        await wait(600);
    };

    await traverse(tree);
    setHighlightedNode(null);
    setIsRunning(false);
};


const dfsInOrderRecursive = async () => {
    if (isRunning) return;
    setIsRunning(true);
    setVisitedNodes([]);
    setSequence([]);
    setLogs([]);
    setCallStack([]);

    const tree = getCurrentTree();

    const traverse = async (node) => {
        if (!node) return;

        setCallStack(prev => [...prev, node.value]);
        log(`CALL traverse(${node.value})`);
        setHighlightedNode(node.id);
        await wait(800);

        if (node.left) await traverse(node.left);

        setVisitedNodes(prev => [...prev, node.id]);
        setSequence(prev => [...prev, node.value]);
        log(`VISIT ${node.value}`);
        await wait(800);

        if (node.right) await traverse(node.right);

        log(`RETURN traverse(${node.value})`);
        setCallStack(prev => prev.slice(0, -1));
        await wait(600);
    };

    await traverse(tree);
    setHighlightedNode(null);
    setIsRunning(false);
};


const dfsPostOrderRecursive = async () => {
    if (isRunning) return;
    setIsRunning(true);
    setVisitedNodes([]);
    setSequence([]);
    setLogs([]);
    setCallStack([]);

    const tree = getCurrentTree();

    const traverse = async (node) => {
        if (!node) return;

        setCallStack(prev => [...prev, node.value]);
        log(`CALL traverse(${node.value})`);
        setHighlightedNode(node.id);
        await wait(800);

        if (node.left) await traverse(node.left);
        if (node.right) await traverse(node.right);

        setVisitedNodes(prev => [...prev, node.id]);
        setSequence(prev => [...prev, node.value]);
        log(`VISIT ${node.value}`);
        await wait(800);

        log(`RETURN traverse(${node.value})`);
        setCallStack(prev => prev.slice(0, -1));
        await wait(600);
    };

    await traverse(tree);
    setHighlightedNode(null);
    setIsRunning(false);
};

            // --- RENDER CONTENT ---
            const renderControlPanel = () => (
                <div className="space-y-4 h-full flex flex-col">
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-8">
                        <div className="space-y-2">
                            <p className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1"><Icon name="layers" size={14}/> DFS</p>
                            <button onClick={dfsPreOrder} disabled={isRunning} className="w-full text-left px-4 py-2 bg-white border border-slate-200 rounded hover:bg-blue-50 text-xs font-bold text-slate-700 flex justify-between group disabled:opacity-50"><span>Pre-order</span> <span className="text-slate-400 font-normal">Root-L-R</span></button>
                            <button onClick={dfsInOrder} disabled={isRunning} className="w-full text-left px-4 py-2 bg-white border border-slate-200 rounded hover:bg-blue-50 text-xs font-bold text-slate-700 flex justify-between group disabled:opacity-50"><span>In-order</span> <span className="text-slate-400 font-normal">L-Root-R</span></button>
                            <button onClick={dfsPostOrder} disabled={isRunning} className="w-full text-left px-4 py-2 bg-white border border-slate-200 rounded hover:bg-blue-50 text-xs font-bold text-slate-700 flex justify-between group disabled:opacity-50"><span>Post-order</span> <span className="text-slate-400 font-normal">L-R-Root</span></button>
                        </div>
                        <div className="space-y-2 flex flex-col">
                            <p className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1"><Icon name="list" size={14}/> BFS</p>
                            <button onClick={bfs} disabled={isRunning} className="w-full text-left px-4 py-2 bg-green-50 border border-green-200 rounded hover:bg-green-100 text-xs font-bold text-green-800 flex justify-between disabled:opacity-50"><span>Level Order</span> <span className="text-green-600 font-normal">BFS</span></button>
                            <div className="pt-2 mt-auto">
                                <button onClick={resetSimulation} disabled={isRunning} className="w-full py-2 border-2 border-dashed border-slate-300 text-slate-500 rounded hover:border-slate-400 hover:text-slate-700 hover:bg-slate-50 text-sm font-bold flex items-center justify-center gap-2"><Icon name="refresh" size={16}/> Reset</button>
                            </div>
                        </div>
                    </div>
                    <p className="text-xs font-bold text-slate-500 uppercase">Recursive DFS</p>
                    <div className="w-full flex gap-5">
                            <button onClick={dfsPreOrderRecursive} disabled={isRunning} className="w-full text-left px-4 py-2 bg-white border border-slate-200 rounded hover:bg-blue-50 text-xs font-bold text-slate-700 flex justify-between group disabled:opacity-50">Recursive Pre-order</button>
                            <button onClick={dfsInOrderRecursive} disabled={isRunning} className="w-full text-left px-4 py-2 bg-white border border-slate-200 rounded hover:bg-blue-50 text-xs font-bold text-slate-700 flex justify-between group disabled:opacity-50">Recursive In-order</button>
                            <button onClick={dfsPostOrderRecursive} disabled={isRunning} className="w-full text-left px-4 py-2 bg-white border border-slate-200 rounded hover:bg-blue-50 text-xs font-bold text-slate-700 flex justify-between group disabled:opacity-50">Recursive Post-order</button>
                    </div>
                </div>
            );

            const renderStructureTab = () => (
                <div className="flex-1 overflow-y-auto p-8 custom-scrollbar max-w-5xl mx-auto space-y-8 animate-in fade-in duration-500 pb-12">
                     <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="p-3 bg-blue-100 text-blue-600 rounded-lg"><Icon name="book" size={32} /></div>
                            <div>
                                <h1 className="text-3xl font-bold text-slate-800">Tree Theory</h1>
                                <p className="text-slate-500">Comprehensive Guide to Tree Data Structures</p>
                            </div>
                        </div>

                        <div className="prose text-slate-600 max-w-none border-b border-slate-100 pb-6 mb-6">
                            <p className="text-lg leading-relaxed">
                                A <strong>Tree</strong> is a non-linear data structure that simulates a hierarchical tree structure, with a root value and subtrees of children with a parent node. It is recursively defined.
                            </p>
                        </div>

                        {/* Extended Terminology */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div className="bg-slate-50 p-5 rounded-lg border border-slate-200">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <Icon name="list" className="text-blue-500"/> Core Terminology
                                </h3>
                                <ul className="space-y-3 text-sm">
                                    <li className="flex gap-2"><span className="font-bold w-20 shrink-0">Root:</span> The topmost node (no parent).</li>
                                    <li className="flex gap-2"><span className="font-bold w-20 shrink-0">Edge:</span> Link between two nodes.</li>
                                    <li className="flex gap-2"><span className="font-bold w-20 shrink-0">Child:</span> A node directly connected to another node when moving away from the Root.</li>
                                    <li className="flex gap-2"><span className="font-bold w-20 shrink-0">Leaf:</span> A node with no children.</li>
                                    <li className="flex gap-2"><span className="font-bold w-20 shrink-0">Subtree:</span> A tree consisting of a node and its descendants.</li>
                                </ul>
                            </div>
                            <div className="bg-slate-50 p-5 rounded-lg border border-slate-200">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <Icon name="layers" className="text-purple-500"/> Properties & Measurements
                                </h3>
                                <ul className="space-y-3 text-sm">
                                    <li className="flex gap-2"><span className="font-bold w-20 shrink-0">Degree:</span> Number of subtrees of a node.</li>
                                    <li className="flex gap-2"><span className="font-bold w-20 shrink-0">Depth:</span> Number of edges from Root to the node.</li>
                                    <li className="flex gap-2"><span className="font-bold w-20 shrink-0">Height:</span> Number of edges from the node to the deepest leaf.</li>
                                    <li className="flex gap-2"><span className="font-bold w-20 shrink-0">Path:</span> Sequence of nodes and edges connecting nodes.</li>
                                </ul>
                            </div>
                        </div>

                        {/* Applications & Complexity */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="md:col-span-1 bg-white border border-slate-200 p-5 rounded-lg shadow-sm">
                                <h3 className="font-bold text-slate-800 mb-3 flex items-center gap-2">
                                    <Icon name="globe" className="text-green-500"/> Real-world Applications
                                </h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm text-slate-600">
                                    <div className="p-3 bg-green-50 rounded border border-green-100">
                                        <strong className="block text-green-800 mb-1">File Systems</strong>
                                        Directories and sub-directories in operating systems (Windows, Linux) are trees.
                                    </div>
                                    <div className="p-3 bg-blue-50 rounded border border-blue-100">
                                        <strong className="block text-blue-800 mb-1">DOM (HTML)</strong>
                                        The Document Object Model in web browsers is a tree of tags.
                                    </div>
                                    <div className="p-3 bg-orange-50 rounded border border-orange-100">
                                        <strong className="block text-orange-800 mb-1">Routing Algorithms</strong>
                                        Network routing protocols often use Spanning Trees.
                                    </div>
                                    <div className="p-3 bg-purple-50 rounded border border-purple-100">
                                        <strong className="block text-purple-800 mb-1">Compilers</strong>
                                        Abstract Syntax Trees (AST) represent code structure.
                                    </div>
                                </div>
                            </div>
                            {/* Applications & Complexity 
                            <div className="bg-slate-900 text-slate-300 p-5 rounded-lg shadow-md">
                                <h3 className="font-bold text-white mb-3 flex items-center gap-2">

                                        <span className="text-red-400">O(n)</span>
                                    </div>

                                        <span>Insert</span>
                                        <span className="text-green-400">O(log n)</span>
                                        <span className="text-red-400">O(n)</span>

                                        <span>Delete</span>
                                        <span className="text-green-400">O(log n)</span>
                                        <span className="text-red-400">O(n)</span>
                                    </div>
                                </div>
                                <p className="text-[10px] text-slate-500 mt-3 italic">*Worst case for BST is O(n) if skewed.</p>

                            */}
                            <div className="flex-1 relative mt-12 flex items-center justify-center">
                                <div className="relative w-full h-full max-w-4xl mx-auto">

                            <div className="flex-1 space-y-1 p-4 overflow-y-auto custom-scrollbar">

                                        <span className="text-slate-600 select-none w-5 text-right opacity-50">{(logs.length - i).toString().padStart(2, '0')}</span>

    <div className="text-[10px] uppercase text-slate-400 font-bold mb-2">

            <div

            >
                traverse({fn})
            </div>
        ))}
    </div>
</div>

                        </div>

                    </div>
                </div>

                            <button onClick={() => setActiveTab('skewed')} className={`w-full text-left px-4 py-3 rounded-lg transition-all text-sm font-medium flex items-center gap-3 ${activeTab === 'skewed' ? 'bg-orange-600 text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400'}`}><Icon name="alert" size={18} /> 3. Unbalanced Variant 1</button>

                        <div className="p-4 border-t border-slate-800 bg-slate-950/50">
                            <div className="text-[10px] text-slate-500 uppercase font-bold mb-2 tracking-wider">Sequence</div>

                    </div>

                            <h2 className="text-xl font-bold text-slate-800 capitalize flex items-center gap-2">{activeTab === 'structure' ? 'Tree Theory' : activeTab === 'traversal' ? 'Standard Binary Tree' : activeTab === 'skewed' ? 'Variant 1 (First Unbalanced Tree)' : 'Variant 2 (Second Unbalanced Tree)'}</h2>

                        {activeTab === 'structure' && renderStructureTab()}

                        {activeTab === 'rec-pre' &&

        "Demonstrates recursive preorder traversal with call stack tracking."
    )
}

{activeTab === 'rec-in' &&
    renderVisualizerLayout(
        STANDARD_TREE,
        "Recursive DFS: Inorder",
        "Recursive inorder traversal showing function call and return."
    )
}

{activeTab === 'rec-post' &&
    renderVisualizerLayout(
        STANDARD_TREE,
        "Recursive DFS: Postorder",
        "Postorder recursion with explicit call stack visualization."
    )
}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
